name: handoff
version: 0.1.0
manifest_version: 2
description: "Take over the agent's browser from the dashboard (or your phone): do a login, 2FA, CAPTCHA or payment yourself, then hand control back. Adds the request_handoff tool, a Screen tab, and `hermes handoff`."
author: Handoff contributors
license: MIT
tags: [browser, dashboard, computer-use, human-in-the-loop]
provides_tools:
  - request_handoff
provides_hooks: []
# No extra Python packages: FastAPI/websockets ship with the dashboard and noVNC is bundled.
# System packages (TigerVNC + Xfce) are installed on first run through Hermes's own Bot Desktop installer.
config_schema:
  auto_install:
    type: bool
    default: true
    description: "On first use, install the screen packages (needs passwordless sudo) and enable browser.headed automatically."
